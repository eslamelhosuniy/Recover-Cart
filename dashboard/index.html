<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover - نظام استرجاع السلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>🛒 Recover</h2>
            </div>
            <nav>
                <a href="#" class="active"><i class="icon">📊</i> لوحة القيادة</a>
                <a href="#"><i class="icon">🛍️</i> السلات المهجورة</a>
                <a href="#"><i class="icon">👥</i> العملاء</a>
                <a href="#"><i class="icon">⚙️</i> الإعدادات</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="header-title">
                    <h1>نظرة عامة</h1>
                    <p>مرحباً بك، إليك أداء متجرك اليوم</p>
                </div>
                <div class="header-actions">
                    <button class="btn-primary" id="refresh-btn">تحديث البيانات</button>
                </div>
            </header>

            <div class="loading-overlay" id="loading-overlay">
                <div class="spinner"></div>
            </div>

            <!-- KPIs -->
            <section class="kpis">
                <div class="kpi-card">
                    <h3>إجمالي السلات</h3>
                    <div class="value" id="kpi-total-carts">0</div>
                </div>
                <div class="kpi-card">
                    <h3>السلات المسترجعة</h3>
                    <div class="value" id="kpi-recovered-carts">0</div>
                </div>
                <div class="kpi-card">
                    <h3>نسبة الاسترجاع</h3>
                    <div class="value" id="kpi-recovery-rate">0%</div>
                </div>
                <div class="kpi-card highlight">
                    <h3>الأرباح المسترجعة</h3>
                    <div class="value" id="kpi-total-revenue">0 ر.س</div>
                </div>
            </section>

            <!-- Data Table -->
            <section class="recent-carts">
                <h2>أحدث السلات المهجورة</h2>
                <div class="table-container">
                    <table id="carts-table">
                        <thead>
                            <tr>
                                <th>رقم السلة</th>
                                <th>القيمة</th>
                                <th>تاريخ الهجر</th>
                                <th>حالة التذكير</th>
                                <th>مسترجعة</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be loaded here via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
